version: '3'

volumes:
  pg_project_notebook:

services:
  pg_db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME:-user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      - POSTGRES_DB=${DB_NAME:-notebook}
    volumes:
      - pg_project_notebook:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  app:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - pg_db
    environment:
      DEEPSEEK_API_KEY: '${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set, see .env.example}'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://pg_db:5432/${DB_NAME:-notebook}'
      SPRING_DATASOURCE_USERNAME: '${DB_USERNAME:-user}'
      SPRING_DATASOURCE_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}'
      DEFAULT_ADMIN_USERNAME: '${DEFAULT_ADMIN_USERNAME:-user}'
      DEFAULT_ADMIN_PASSWORD: '${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set, see .env.example}'
      JAVA_OPTS: '-Xmx512m'
# === Spring Application ===
spring.application.name=CodeSage
# === DataSource ===
spring.datasource.url=jdbc:postgresql://localhost:5433/notebook
spring.datasource.username=user
spring.datasource.password=1234
# === JPA & Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# === Liquibase ===
spring.liquibase.change-log=classpath:db/changelog/changelog.xml
# === Spring MVC ===
spring.mvc.hiddenmethod.filter.enabled=true
# === Security (default user) ===
spring.security.user.name=user
spring.security.user.password=root
# === Thymeleaf ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# === Server ===
server.error.whitelabel.enabled=false
# === DeepSeek API ===
deepseek.model=deepseek-chat
deepseek.stream=false
deepseek.system.role=system
deepseek.system.content=Ты получаешь код на Java или другом языке. Твоя задача — анализировать его и генерировать JSON-массив в поле "recommendations". Каждый элемент массива должен содержать: issue (описание проблемы), description (подробности), suggestion (рекомендация), example (пример исправления), note (дополнительная заметка). Текстовое описание можно писать на русском, JSON должен быть корректным. Пример структуры: {"recommendations":[{"issue":"...", "description":"...", "suggestion":"...", "example":"...", "note":"..."}]}
deepseek.system.example=Например, если пользователь присылает код с ошибкой, твоя задача — вернуть JSON следующего вида: {"recommendations":[{"issue":"Ошибка в цикле", "description":"Цикл бесконечный из-за неверного условия", "suggestion":"Исправить условие в for", "example":"for(int i=0;i<10;i++){...}", "note":"Проверить индексацию массива"}]}  
deepseek.system.You-analysis-assistant=Ты — ассистент по анализу кода. Получаешь исходный код, возвращаешь структурированные рекомендации в JSON, как описано в "deepseek.system.content".
deepseek.user.role=user
server.servlet.session.timeout=3153600000
# === Spring Application ===
spring.application.name=CodeSage
# === DataSource ===
spring.datasource.url=jdbc:postgresql://localhost:5433/notebook
spring.datasource.username=user
spring.datasource.password=1234
# === JPA & Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# === Liquibase ===
spring.liquibase.change-log=classpath:db/changelog/changelog.xml
# === Spring MVC ===
spring.mvc.hiddenmethod.filter.enabled=true
# === Security (default user) ===
spring.security.user.name=user
spring.security.user.password=root
# === Thymeleaf ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# === Server ===
server.error.whitelabel.enabled=false
# === DeepSeek API ===
deepseek.model=deepseek-chat
deepseek.stream=false
deepseek.system.role=system
deepseek.system.content=Ты получаешь код на Java или другом языке. Твоя задача — анализировать его и генерировать JSON-массив в поле "recommendations". Каждый элемент массива должен содержать: issue (описание проблемы), description (подробности), suggestion (рекомендация), example (пример исправления), note (дополнительная заметка). Текстовое описание можно писать на русском, JSON должен быть корректным. Пример структуры: {"recommendations":[{"issue":"...", "description":"...", "suggestion":"...", "example":"...", "note":"..."}]}
deepseek.system.example=Например, если пользователь присылает код с ошибкой, твоя задача — вернуть JSON следующего вида: {"recommendations":[{"issue":"Ошибка в цикле", "description":"Цикл бесконечный из-за неверного условия", "suggestion":"Исправить условие в for", "example":"for(int i=0;i<10;i++){...}", "note":"Проверить индексацию массива"}]}  
deepseek.system.You-analysis-assistant=Ты — ассистент по анализу кода. Получаешь исходный код, возвращаешь структурированные рекомендации в JSON, как описано в "deepseek.system.content".
deepseek.user.role=user
server.servlet.session.timeout=3153600000

subEditor.deepseek.api.you-analysis-assistant=You are an expert in movie recognition and multilingual subtitle translation.
subEditor.deepseek.api.system-content=Your task is to process a JSON object representing a Movie. The input Movie has: \
  - "name": initially set to the filename (e.g., "movie_file.srt"), which is not the real movie title. \
  - "subtitles": a list of SubtitleEntry objects. Each SubtitleEntry has: \
    - "language": a ULocale code (e.g., "en_US" for English). \
    - "subtitles": a list of Subtitle objects, each with: \
      - "start": null or empty (no time). \
      - "end": null or empty (no time). \
      - "text": the subtitle text in the original language. \
  Steps to perform: \
  1. Analyze the subtitle texts across all SubtitleEntry to identify the real movie title. Use the content to recognize famous movies, dialogues, or plot elements. If uncertain, make an educated guess based on common movies. \
  2. Update the "name" field to the recognized real movie title (in English, if possible). \
  3. For subtitles: \
     - Assume the original subtitles are in one language (detect it if needed). \
     - Create two SubtitleEntry: one for English (language: "en_US") and one for Russian (language: "ru_RU"). \
     - Translate all original subtitle texts to English and Russian. \
     - Keep the structure: each SubtitleEntry should have a list of Subtitle with "text" translated, and "start"/"end" remain null. \
     - Remove any original SubtitleEntry that are not EN or RU; output only the new EN and RU entries. \
  4. Do not add or invent timings (start/end) – keep them as null. \
  5. Output ONLY the updated JSON object for the Movie. No explanations, no extra text – just valid JSON.
subEditor.deepseek.api.example=Example input JSON: \
  { \
    "id": null, \
    "name": "example_movie.srt", \
    "subtitles": [ \
      { \
        "id": null, \
        "subtitles": [ \
          { \
            "id": null, \
            "start": null, \
            "end": null, \
            "text": "Hello, world!" \
          }, \
          { \
            "id": null, \
            "start": null, \
            "end": null, \
            "text": "This is a test." \
          } \
        ], \
        "language": "en_US" \
      } \
    ] \
  }


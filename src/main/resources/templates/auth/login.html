<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>header</title>
    <!--/*/ <th:block th:insert="~{headers/header.html :: head}">
      </th:block> /*/-->
</head>
<body>
<!--/*/ <th:block th:insert="~{auth/navbar.html :: navbar}">
  </th:block> /*/-->

<div class="row align-items-center" style="height: 200px;">
    <div class="col">
    </div>
    <div class="col text-center">
        <img th:src="@{/images/notebook.png}" alt="NOTEBOOK"/>
    </div>
    <div class="col">
    </div>
</div>

<div class="row">
    <div class="col">
    </div>
    <div class="col-6 col-md-5 col-xl-3 text-center">
        <form th:method="POST" th:action="@{/perform-login}">
            <input class="form-control" type="text" name="username" placeholder="Имя пользователя"/>
            <br/>
            <input class="form-control" type="password" name="password" placeholder="Пароль"/>
            <br/>
            <div class="row">
                <div class="col"></div>
                <div class="col text-center">
                    <input class="btn btn-primary" type="submit" value="Войти"/>
                </div>
                <div class="col"></div>
            </div>
            <div th:if="${param.error}" style="color: red">Неправильные имя или пароль</div>
            <br/>
            <div class="row">
                <div class="col"></div>
                <div class="col text-center">
                    <a href="/register">Регистрация</a>
                </div>
                <div class="col"></div>
            </div>
            <div class="projects-section">
                <h3 class="projects-title">Другие мои проекты</h3>
                <div class="projects-grid">
                    <a href="/codesaga/" class="project-card">
                        <div class="project-icon">⚡</div>
                        <div class="project-name">Code Saga</div>
                        <div class="project-description">AI ассистент для разработчиков</div>
                    </a>
                    <a href="/subeditor/upload" class="project-card">
                        <div class="project-icon">🎬</div>
                        <div class="project-name">Subeditor</div>
                        <div class="project-description">Редактор субтитров и переводов</div>
                    </a>
                    <a href="/translator" class="project-card">
                        <div class="project-icon">📖</div>
                        <div class="project-name">wordsTranslator</div>
                        <div class="project-description">Аккумулирование и перевод Анл слов</div>
                    </a>
                </div>
            </div>
        </form>
    </div>
    <div class="col">
    </div>
</div>
<footer class="card-footer fixed-bottom">
    <div class="row">
        <div class="col-1"></div>
        <div class="col-10 align-items-start"><p>По всем вопросам пишите в <a href="https://t.me/VavilovNikita59">Telegram</a>
        </p>
            <p>© 2025 Copyright</p></div>
        <div class="col-1"></div>
    </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Экспорт кода из репозитория</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/codeSaga.css}">
</head>
<body>
<div class="header">
  <div class="header-content">
    <div class="logo">
      <i>⚡</i> CodeSaga - Экспорт кода
    </div>
  </div>
</div>

<div class="container">
  <div class="nav">
    <a href="/" th:href="@{/codesaga/}">Главная</a>
    <a href="/reviewHistory" th:href="@{/codesaga/reviewHistory}">История запросов</a>
    <a href="/export" th:href="@{/codesaga/export}">Экспорт кода</a>
    <a href="/codesaga/export" th:href="@{/}">Notebook</a>
  </div>

  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Экспорт кода из Git-репозитория</h1>
    </div>
    <div class="card-body">
      <form th:action="@{/codesaga/export}" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="repoUrl" class="form-label">Ссылка на репозиторий:</label>
          <input type="text" id="repoUrl" name="repoUrl" class="form-control"
                 placeholder="https://github.com/user/repo" />
        </div>

        <div class="form-group">
          <label class="form-label">или загрузите архив .zip с Java-файлами:</label>
          <input type="file" id="file" name="file" class="form-control" accept=".zip" />
        </div>

        <button type="submit" class="btn">Экспортировать</button>
      </form>

      <div th:if="${exportedCode}" class="mt-3">
        <h3>Результат:</h3>
        <button onclick="copyToClipboard()" class="btn btn-success">Скопировать в буфер обмена</button>
        <pre class="export-result" id="exportedCode" th:text="${exportedCode}"></pre>
      </div>
    </div>
  </div>
</div>

<script>
  function copyToClipboard() {
    const codeElement = document.getElementById("exportedCode");
    const range = document.createRange();
    range.selectNode(codeElement);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
    window.getSelection().removeAllRanges();
    alert("Код скопирован в буфер обмена!");
  }
</script>
</body>
</html>

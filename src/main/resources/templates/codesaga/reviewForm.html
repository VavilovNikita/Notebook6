<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI-Powered Code & Log Assistant</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/codeSaga.css}">
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo">
            <i>⚡</i> CodeSaga AI Assistant
        </div>
    </div>
</div>

<div class="container">
    <div class="nav">
        <a href="/" th:href="@{/codesaga/}">Главная</a>
        <a href="/reviewHistory" th:href="@{/codesaga/reviewHistory}">История запросов</a>
        <a href="/export" th:href="@{/codesaga/export}">Экспорт кода</a>
        <a href="/codesaga/export" th:href="@{/}">Notebook</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">AI-Powered Code & Log Assistant</h1>
        </div>
        <div class="card-body">
            <form th:action="@{/codesaga/submitReview}" method="post">
                <div class="form-group">
                    <label class="form-label">Выберите режим:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="LOGS" checked onchange="toggleInput()">
                            Ввести логи
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="PR" onchange="toggleInput()">
                            Ввести ссылку на PR
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="CODE" onchange="toggleInput()">
                            Ввести код
                        </label>
                    </div>
                </div>

                <div id="logsSection">
                    <div class="form-group">
                        <label for="codeAndLogs" class="form-label">Введите логи для проверки:</label>
                        <textarea id="codeAndLogs" name="inputText" class="form-control" required></textarea>
                    </div>
                </div>

                <div id="prSection" class="hidden">
                    <div class="form-group">
                        <label for="pullRequestUrl" class="form-label">Ссылка на Pull Request для ревью:</label>
                        <input type="text" id="pullRequestUrl" name="inputText" class="form-control"
                               placeholder="https://github.com/user/repo/pull/123" />
                    </div>
                </div>

                <div id="codeSection" class="hidden">
                    <div class="form-group">
                        <label for="codeInput" class="form-label">Введите код для анализа:</label>
                        <textarea id="codeInput" name="inputText" class="form-control"
                                  placeholder="public class Example { ... }"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn">Отправить</button>
            </form>

            <div th:if="${message}" class="mt-3">
                <pre th:text="${message}"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleInput() {
        const mode = document.querySelector('input[name="mode"]:checked').value;

        const logsSection = document.getElementById('logsSection');
        const prSection = document.getElementById('prSection');
        const codeSection = document.getElementById('codeSection');

        logsSection.classList.add('hidden');
        prSection.classList.add('hidden');
        codeSection.classList.add('hidden');

        document.getElementById('codeAndLogs').removeAttribute('required');
        document.getElementById('pullRequestUrl').removeAttribute('required');
        document.getElementById('codeInput').removeAttribute('required');

        if (mode === 'LOGS') {
            logsSection.classList.remove('hidden');
            document.getElementById('codeAndLogs').setAttribute('required', 'required');
        } else if (mode === 'PR') {
            prSection.classList.remove('hidden');
            document.getElementById('pullRequestUrl').setAttribute('required', 'required');
        } else if (mode === 'CODE') {
            codeSection.classList.remove('hidden');
            document.getElementById('codeInput').setAttribute('required', 'required');
        }
    }

    toggleInput();
</script>
</body>
</html>

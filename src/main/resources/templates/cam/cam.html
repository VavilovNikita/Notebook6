<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        #status {
            background: #000;
            color: #fff;
            padding: 30px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        .hidden { display: none !important; }
        #nativeVideo {
            width: 100%;
            max-width: 100%;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>
    <div id="error"></div>

    <div id="playerContainer" class="hidden">
        <!-- Для iOS используем нативный video -->
        <video
                id="nativeVideo"
                controls
                playsinline
                webkit-playsinline
                muted>
            Ваш браузер не поддерживает видео.
        </video>
    </div>
</div>

<script>
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const playerContainer = document.getElementById('playerContainer');
    const nativeVideo = document.getElementById('nativeVideo');

    const streamUrl = 'https://notebook6.ru/hls/camera1.m3u8';

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        status.style.display = 'block';
        status.textContent = 'Ошибка. Нажмите для повторной попытки';
        playerContainer.classList.add('hidden');
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    function initializePlayer() {
        status.textContent = 'Запуск...';
        hideError();
        playerContainer.classList.remove('hidden');

        // ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ КЭША - добавляем случайный параметр
        const cacheBuster = 't=' + Date.now() + '&r=' + Math.random();
        const currentStreamUrl = streamUrl + '?' + cacheBuster;

        console.log('Loading stream:', currentStreamUrl);

        // Останавливаем предыдущее видео
        nativeVideo.pause();
        nativeVideo.src = '';

        // Устанавливаем новый источник
        nativeVideo.src = currentStreamUrl;
        nativeVideo.load();

        let loadTimeout = setTimeout(() => {
            console.log('Load timeout - forcing play');
            nativeVideo.play().catch(e => console.log('Force play error:', e));
        }, 3000);

        nativeVideo.addEventListener('loadeddata', function() {
            console.log('Video loaded successfully');
            clearTimeout(loadTimeout);
            hideError();
            status.style.display = 'none';
        });

        nativeVideo.addEventListener('error', function(e) {
            console.error('Video error:', nativeVideo.error);
            clearTimeout(loadTimeout);
            showError(`Ошибка загрузки видео: ${nativeVideo.error ? nativeVideo.error.message : 'Unknown error'}`);
        });

        nativeVideo.addEventListener('waiting', function() {
            console.log('Video waiting for data...');
        });

        nativeVideo.addEventListener('playing', function() {
            console.log('Video playing successfully');
            clearTimeout(loadTimeout);
            hideError();
            status.style.display = 'none';
        });

        // Пытаемся запустить воспроизведение
        const playPromise = nativeVideo.play();

        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log('Autoplay failed:', error);
                status.style.display = 'block';
                status.textContent = 'Нажмите для начала воспроизведения';
            });
        }
    }

    // Функция для принудительного обновления потока
    function forceRefreshStream() {
        console.log('Force refreshing stream...');
        if (nativeVideo.src) {
            const newUrl = nativeVideo.src.split('?')[0] + '?force=' + Date.now();
            nativeVideo.src = newUrl;
            nativeVideo.load();
            nativeVideo.play().catch(e => console.log('Refresh play error:', e));
        }
    }

    status.addEventListener('click', initializePlayer);

    // Автоматическая попытка инициализации
    setTimeout(initializePlayer, 1000);

    // Добавляем кнопку для принудительного обновления (для отладки)
    const refreshBtn = document.createElement('button');
    refreshBtn.textContent = 'Обновить поток';
    refreshBtn.style.margin = '10px';
    refreshBtn.onclick = forceRefreshStream;
    document.querySelector('.container').appendChild(refreshBtn);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        #status {
            background: #000;
            color: #fff;
            padding: 30px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        .hidden { display: none !important; }
        #nativeVideo {
            width: 100%;
            max-width: 100%;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>
    <div id="error"></div>

    <div id="playerContainer" class="hidden">
        <!-- Для iOS используем нативный video -->
        <video
                id="nativeVideo"
                controls
                playsinline
                webkit-playsinline
                muted>
            Ваш браузер не поддерживает видео.
        </video>
    </div>
</div>

<script>
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const playerContainer = document.getElementById('playerContainer');
    const nativeVideo = document.getElementById('nativeVideo');
    const url = 'https://notebook6.ru/hls/camera1.m3u8?_=' + Date.now();

    let isInitialized = false;

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        status.style.display = 'block';
        status.textContent = 'Ошибка. Нажмите для повторной попытки';
        playerContainer.classList.add('hidden');
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    function initializePlayer() {
        if (isInitialized) {
            // Перезагрузка потока
            nativeVideo.src = url + '&t=' + Date.now();
            nativeVideo.load();
            nativeVideo.play().catch(e => console.log('Play error:', e));
            return;
        }

        status.textContent = 'Запуск...';
        hideError();

        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        playerContainer.classList.remove('hidden');

        // Для всех устройств используем нативный video элемент
        console.log("Using native video element");

        // Добавляем временную метку для избежания кэширования
        const streamUrl = url + '&t=' + Date.now();

        nativeVideo.src = streamUrl;
        nativeVideo.load();

        nativeVideo.addEventListener('loadeddata', function() {
            console.log('Video loaded - playing...');
            hideError();
            status.style.display = 'none';
        });

        nativeVideo.addEventListener('error', function(e) {
            console.error('Video error:', e);
            showError("Ошибка загрузки видео");
        });

        nativeVideo.addEventListener('waiting', function() {
            console.log('Video waiting for data...');
        });

        nativeVideo.addEventListener('playing', function() {
            console.log('Video playing successfully');
            hideError();
            status.style.display = 'none';
        });

        // Пытаемся запустить воспроизведение
        const playPromise = nativeVideo.play();

        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log('Autoplay failed:', error);
                status.style.display = 'block';
                status.textContent = 'Нажмите для начала воспроизведения';
            });
        }

        isInitialized = true;
    }

    status.addEventListener('click', initializePlayer);

    // Автоматическая попытка инициализации при загрузке страницы
    setTimeout(initializePlayer, 1000);
</script>

</body>
</html>

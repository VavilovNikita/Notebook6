<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Камера 1 – прямая трансляция</title>

    <!-- Последняя версия Video.js (2025) -->
    <link href="https://vjs.zencdn.net/8.12.0/video-js.css" rel="stylesheet" />
    <style>
        body { margin:0; background:#000; font-family: Arial, sans-serif; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 10px; }
        h2 { color: #fff; text-align: center; }
        #status {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 12px;
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s;
        }
        .video-js { width: 100%; height: auto; aspect-ratio: 16/9; background: #000; }
        .vjs-big-play-button { font-size: 3em !important; line-height: 1.5 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>

    <video
            id="player"
            class="video-js vjs-default-skin"
            controls
            preload="auto"
            playsinline
            muted
            width="100%"
            height="auto">
        <source src="https://notebook6.ru/hls/camera1.m3u8" type="application/x-mpegURL">
    </video>
</div>

<!-- Video.js + Hls.js -->
<script src="https://vjs.zencdn.net/8.12.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    const video = document.getElementById('player');
    const status = document.getElementById('status');
    const url = 'https://notebook6.ru/hls/camera1.m3u8';

    let player, hls;
    let hasInteracted = false;

    // Разблокировка автоплея после любого пользовательского действия
    function unlockAndPlay() {
        if (hasInteracted) return;
        hasInteracted = true;

        status.textContent = 'Загрузка трансляции…';

        // Убираем оверлей через секунду после начала воспроизведения
        setTimeout(() => {
            status.style.opacity = '0';
            setTimeout(() => status.remove(), 600);
        }, 1000);

        initPlayer();
    }

    // Слушаем первое взаимодействие пользователя
    ['click', 'touchstart', 'keydown'].forEach(evt => {
        document.addEventListener(evt, unlockAndPlay, { once: true, passive: true });
    });

    function initPlayer() {
        player = videojs('player', {
            fluid: true,
            responsive: true,
            liveui: true,
            html5: {
                vhs: { overrideNative: true },
                nativeVideoTracks: false,
                nativeAudioTracks: false,
                nativeTextTracks: false
            }
        });

        // На iOS Safari используем нативную поддержку HLS (самый надёжный способ)
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('canplay', () => {
                video.play().catch(e => console.log("iOS play prevented:", e));
            });
        }
        // На всех остальных — Hls.js
        else if (Hls.isSupported()) {
            hls = new Hls({
                liveSyncDuration: 3,
                liveMaxLatencyDuration: 10,
                maxBufferLength: 10
            });
            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error('HLS Fatal error', data);
                    status.textContent = 'Ошибка потока. Перезагрузите страницу.';
                    status.style.opacity = '1';
                }
            });
        }
        // Если ничего не поддерживается (очень старый Android)
        else {
            status.textContent = 'Ваш браузер не поддерживает воспроизведение.';
            status.style.opacity = '1';
        }
    }

    // Попытка автозапуска после загрузки (на десктопе может сработать)
    window.addEventListener('load', () => {
        if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            unlockAndPlay();
        }
    });
</script>
</body>
</html>

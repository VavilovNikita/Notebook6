<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – тестирование</title>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        video { width: 100%; max-width: 800px; background: #000; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .loading { background: #fff3cd; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
<h2>Тестирование HLS потока</h2>

<div id="status" class="status loading">Проверяем поток...</div>
<button onclick="testStream()">Тестировать поток</button>
<button onclick="clearCache()">Очистить кэш</button>

<div id="player" style="margin-top: 20px;">
    <video id="video" controls playsinline webkit-playsinline muted></video>
</div>

<div id="debug" style="margin-top: 20px; font-family: monospace; font-size: 12px;"></div>

<script>
    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const debugDiv = document.getElementById('debug');

    const STREAM_URL = 'https://notebook6.ru/hls/camera1.m3u8';

    async function testStream() {
        statusDiv.className = 'status loading';
        statusDiv.textContent = 'Проверяем доступность потока...';
        debugDiv.innerHTML = '';

        try {
            // Тестируем доступность m3u8
            const testUrl = STREAM_URL + '?t=' + Date.now();
            const response = await fetch(testUrl);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const m3u8Content = await response.text();
            debugDiv.innerHTML += `<strong>M3U8 содержимое:</strong><br><pre>${m3u8Content}</pre>`;

            statusDiv.textContent = 'M3U8 доступен. Загружаем видео...';

            // Загружаем видео
            video.src = testUrl;
            video.load();

            return new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    reject(new Error('Таймаут загрузки видео'));
                }, 10000);

                video.addEventListener('loadeddata', () => {
                    clearTimeout(timeout);
                    statusDiv.className = 'status success';
                    statusDiv.textContent = 'Видео загружено!';
                    resolve();
                });

                video.addEventListener('error', (e) => {
                    clearTimeout(timeout);
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `Ошибка видео: ${video.error?.message || 'Unknown error'}`;
                    reject(e);
                });
            });

        } catch (error) {
            statusDiv.className = 'status error';
            statusDiv.textContent = `Ошибка: ${error.message}`;
            debugDiv.innerHTML += `<strong>Ошибка:</strong> ${error.message}`;
        }
    }

    function clearCache() {
        video.src = '';
        video.load();
        statusDiv.textContent = 'Кэш очищен';
        debugDiv.innerHTML = '';
    }

    // Автотест при загрузке
    setTimeout(testStream, 1000);
</script>
</body>
</html>

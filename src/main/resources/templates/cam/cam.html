<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; font-family: Arial, sans-serif; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; text-align: center; }
        #status {
            background: #007bff;
            color: white;
            padding: 20px;
            font-size: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            background: black;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">▶️ НАЖМИТЕ ДЛЯ ЗАПУСКА ТРАНСЛЯЦИИ</div>
    <div id="error"></div>

    <video
            id="videoPlayer"
            controls
            playsinline
            webkit-playsinline
            preload="none"
            style="display: none;">
        Ваш браузер не поддерживает воспроизведение видео.
    </video>
</div>

<script>
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const video = document.getElementById('videoPlayer');
    const url = 'https://notebook6.ru/hls/camera1.m3u8';

    let isPlaying = false;

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        status.style.display = 'block';
        status.textContent = '❌ ' + message + ' - Нажмите для повторной попытки';
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    function startPlayback() {
        if (isPlaying) return;

        status.textContent = '🔄 Загружаем трансляцию...';
        hideError();

        // Для iOS используем нативный HLS
        video.style.display = 'block';
        video.src = url;

        // Ждем когда видео будет готово
        video.addEventListener('loadedmetadata', function() {
            console.log('Video metadata loaded');
            status.style.display = 'none';
            isPlaying = true;

            // Пытаемся запустить воспроизведение
            video.play().then(() => {
                console.log('Video started playing');
                hideError();
            }).catch(error => {
                console.log('Autoplay blocked:', error);
                // На iOS автоплей блокируется - показываем кнопку play
                showError('Нажмите кнопку PLAY в плеере');
            });
        });

        // Обработчики ошибок
        video.addEventListener('error', function(e) {
            console.error('Video error:', e);
            showError('Ошибка загрузки видео. Проверьте подключение');
        });

        video.addEventListener('waiting', function() {
            console.log('Video waiting for data...');
        });

        video.addEventListener('playing', function() {
            console.log('Video playing');
            hideError();
        });

        // Таймаут - если долго грузит
        setTimeout(() => {
            if (video.readyState < 1) {
                showError('Долгая загрузка. Проверьте интернет');
            }
        }, 10000);
    }

    // Запуск по клику
    status.addEventListener('click', startPlayback);

    // Также запускаем при любом касании (для iOS)
    document.addEventListener('touchstart', function() {
        if (!isPlaying) {
            startPlayback();
        }
    }, { once: true });

    // Проверяем доступность потока
    function checkStream() {
        fetch(url, {
            method: 'GET',
            headers: {
                'Accept': 'application/vnd.apple.mpegurl, */*'
            }
        })
            .then(response => {
                if (!response.ok) {
                    showError('Трансляция временно недоступна');
                }
            })
            .catch(() => {
                showError('Не удалось подключиться к серверу');
            });
    }

    // Проверяем при загрузке
    checkStream();
</script>

</body>
</html>

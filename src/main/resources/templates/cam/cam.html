<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прямая Трансляция с Камеры</title>

    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />

    <style>
        /* Центрирование и адаптивность */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            padding: 20px;
        }
        .video-wrapper {
            max-width: 900px; /* Максимальная ширина плеера */
            margin: 0 auto; /* Центрирование */
            background: #000;
        }
        /* Стиль для центрирования кнопки проигрывания */
        .vjs-big-play-centered {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <h2>Live Stream: Камера 1</h2>

    <video id="camera-player"
           class="video-js vjs-default-skin vjs-big-play-centered"
           controls
           preload="auto"
           width="100%"
           data-setup='{"fluid": true, "liveui": true}'>

        <source src="https://notebook6.ru/hls/camera1.m3u8" type="application/x-mpegURL">

        <p class="vjs-no-js">
            Для просмотра видео включите JavaScript и рассмотрите возможность обновления до веб-браузера, поддерживающего HTML5-видео.
        </p>
    </video>
</div>

<script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

<script>
    // Инициализация плеера
    var player = videojs('camera-player');

    // Установка опций (если нужны специфичные настройки)
    player.ready(function() {
        // Опция для улучшения отображения в реальном времени
        this.liveTracker.on('liveedgechange', function() {
            this.liveSeeker.seekToLiveEdge();
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        #status {
            background: #000;
            color: #fff;
            padding: 30px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        .hidden { display: none !important; }
        video {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>
    <div id="error"></div>

    <video
            id="videoPlayer"
            controls
            playsinline
            webkit-playsinline
            preload="none"
            class="hidden">
        <source src="https://notebook6.ru/hls/camera1.m3u8" type="application/vnd.apple.mpegurl">
    </video>
</div>

<script>
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const video = document.getElementById('videoPlayer');
    const url = 'https://notebook6.ru/hls/camera1.m3u8';

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        status.textContent = 'Ошибка. Нажмите для повторной попытки';
    }

    function startPlayback() {
        // МАКСИМАЛЬНО ПРОСТО для iPhone
        status.classList.add('hidden');
        video.classList.remove('hidden');

        // Сразу после клика запускаем воспроизведение
        video.play().then(() => {
            console.log('Video started on iPhone');
        }).catch(error => {
            console.log('iPhone autoplay blocked - user must click play');
            // На iOS это нормально
        });
    }

    // Один простой обработчик
    status.addEventListener('click', startPlayback);

    // Проверка доступности потока
    fetch(url, { method: 'HEAD' }).catch(() => {
        showError('Трансляция временно недоступна');
    });
</script>

</body>
</html>

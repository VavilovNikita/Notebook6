<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        #status {
            background: #000;
            color: #fff;
            padding: 30px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>
    <div id="error"></div>

    <div id="playerContainer" class="hidden">
        <video
                id="player"
                class="video-js"
                controls
                preload="auto"
                width="100%"
                height="auto"
                playsinline
                webkit-playsinline>
        </video>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

<script>
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const playerContainer = document.getElementById('playerContainer');
    const url = 'https://notebook6.ru/hls-live/live/camera1/index.m3u8';

    let player = null;
    let isInitialized = false;

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        status.style.display = 'block';
        status.textContent = 'Ошибка. Нажмите для повторной попытки';
        playerContainer.classList.add('hidden');
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    function initializePlayer() {
        if (isInitialized) return;

        status.textContent = 'Запуск...';
        status.style.display = 'none';
        hideError();

        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        playerContainer.classList.remove('hidden');

        // ---- iPhone / iPad — НАТИВНЫЙ HLS ----
        if (isIOS) {
            console.log("iOS detected → using native HLS");

            const video = document.getElementById("player");
            video.src = url;
            video.load();

            video.play().catch(() => {
                status.style.display = 'block';
                status.textContent = 'Нажмите для начала воспроизведения';
            });

            isInitialized = true;
            return;
        }

        // ---- ПК / Android — video.js + Hls.js ----
        console.log("Desktop/Android → using Video.js + HLS.js");

        player = videojs('player', {
            fluid: true,
            liveui: true,
            controls: true,
            preload: 'auto',
            playsinline: true
        });

        player.ready(() => {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    // Добавляем настройки для повышения стабильности HLS
                    lowLatencyMode: false, // Отключаем LL в плеере, если отключили на сервере
                    enableWorker: true,
                    // Агрессивные настройки восстановления (для живого стрима)
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 5,
                    levelLoadingRetryDelay: 1000,
                    manifestLoadingRetryDelay: 1000
                });

                hls.loadSource(url);
                hls.attachMedia(player.tech().el());

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    hideError();
                    player.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS.js error:', data);

                    if (data.fatal) {
                        // Если ошибка фатальная, пробуем восстановить поток
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            // Ошибки сети часто можно восстановить
                            console.log("HLS.js: Trying to recover from network error...");
                            hls.recoverMediaError();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            console.log("HLS.js: Trying to swap audio/video codecs...");
                            hls.swapAudioCodec();
                            hls.recoverMediaError();
                        } else {
                            // Если восстановление не помогло, показываем ошибку пользователю
                            showError("Ошибка воспроизведения. Пожалуйста, перезапустите.");
                        }
                    }
                });

            } else {
                player.src({ src: url, type: 'application/x-mpegURL' });
                player.play().catch(() => {});
            }
        });

        isInitialized = true;
    }

    status.addEventListener('click', initializePlayer);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        #status { transition: all 0.5s; }
        .click-to-play { background: #000; color: #fff; padding: 30px; font-size: 24px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<div style="max-width: 960px; margin: 20px auto;">
    <h2>Live: Камера 1</h2>
    <div id="status" class="click-to-play">Нажмите или коснитесь экрана для запуска трансляции</div>
    <div id="error" style="color:red; display:none; margin:10px 0;"></div>

    <video id="player" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="auto">
        <source src="https://notebook6.ru/hls/camera1/index.m3u8" type="application/x-mpegURL">
    </video>
</div>

<script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10"></script>

<script>
    const video = document.getElementById('player');
    const status = document.getElementById('status');
    const errorDiv = document.getElementById('error');
    const url = 'https://notebook6.ru/hls/camera1.m3u8';

    let player, hls;
    let unlocked = false;

    // Один раз — разблокируем автоплей после любого взаимодействия
    const unlock = () => {
        if (unlocked) return;
        unlocked = true;
        status.textContent = 'Запускаем стрим…';
        status.classList.remove('click-to-play');
        document.removeEventListener('click', unlock);
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('keydown', unlock);
        initPlayer();
    };
    document.addEventListener('click', unlock, { once: true });
    document.addEventListener('touchstart', unlock, { once: true });
    document.addEventListener('keydown', unlock, { once: true });

    function initPlayer() {
        player = videojs(video, { fluid: true, liveui: true });

        if (Hls.isSupported()) {
            hls = new Hls({ liveSyncDuration: 3, liveMaxLatencyDuration: 8 });
            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                status.textContent = 'Идёт трансляция';
                player.play();
            });

            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = 'Ошибка соединения: ' + data.type;
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }
</script>

</body>
</html>

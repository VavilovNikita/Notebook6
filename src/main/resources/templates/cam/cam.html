<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера 1 – прямая трансляция</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        #status {
            background: #000;
            color: #fff;
            padding: 30px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #error {
            color: red;
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live: Камера 1</h2>
    <div id="status">Нажмите для запуска трансляции</div>
    <div id="error"></div>

    <div id="playerContainer" class="hidden">
        <video
                id="player"
                class="video-js"
                controls
                preload="auto"
                width="100%"
                height="auto"
                playsinline
                webkit-playsinline>
        </video>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

<script>
    const status = document.getElementById('status');
    const playerContainer = document.getElementById('playerContainer');
    const url = 'https://notebook6.ru/hls/camera1.m3u8';  // ← один и тот же URL везде

    function init() {
        status.style.display = 'none';
        playerContainer.classList.remove('hidden');

        const video = document.getElementById('player');

        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            // iOS — нативный плеер + небольшая задержка
            video.src = url;
            video.load();

            // Ждём 4 секунды, чтобы точно были сегменты
            setTimeout(() => {
                video.play().catch(() => {
                    status.style.display = 'block';
                    status.textContent = 'Нажмите для воспроизведения';
                });
            }, 4000);
        } else {
            // Все остальные — сразу
            const player = videojs('player', { fluid: true, liveui: true });
            if (Hls.isSupported()) {
                const hls = new Hls({ lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                player.src({ src: url, type: 'application/x-mpegURL' });
            }
            player.play();
        }
    }

    status.addEventListener('click', init);
</script>

</body>
</html>

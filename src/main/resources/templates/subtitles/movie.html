<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Фильм: <span th:text="${movie.name}"></span></title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/codeSaga.css}">
    <style>
        .translation-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: var(--border-radius);
            border: 1px solid #e9ecef;
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .language-form {
            display: contents; /* Форма внутри каждой карточки */
        }

        .language-btn {
            width: 100%;
            padding: 1rem;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            font-family: inherit;
        }

        .language-btn:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .language-btn:active {
            border-color: var(--success);
            background: #f0fff4;
        }

        .language-flag {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .language-name {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .language-native {
            font-size: 0.9rem;
            color: var(--text-light);
            font-style: italic;
        }

        .movie-info {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .subtitles-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo">
            <i>🎬</i> Subeditor - Фильм
        </div>
    </div>
</div>

<div class="container">
    <div class="nav">
        <a href="/">Главная</a>
        <a href="/subeditor/upload">Загрузить фильм</a>
        <a href="/subeditor/movies">Все фильмы</a>
    </div>

    <div class="movie-info">
        <h1 th:text="${movie.name}">Название фильма</h1>
        <p><strong>ID:</strong> <span th:text="${movie.id}"></span></p>
    </div>

    <!-- Секция перевода -->
    <div class="translation-section">
        <h2>Выберите язык для перевода</h2>
        <p>Нажмите на язык для автоматического перевода</p>

        <div class="language-grid">
            <th:block th:each="lang : ${languages}">
                <form th:action="@{/subeditor/translate/__${movie.id}__/__${lang.id}__}"
                      method="post"
                      class="language-form">
                    <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="language-btn">
                        <div class="language-flag" th:text="${lang.flag}">🇺🇸</div>
                        <div class="language-name" th:text="${lang.nameRu}">Английский</div>
                        <div class="language-native" th:text="${lang.nameNative}">English</div>
                    </button>
                </form>
            </th:block>
        </div>
    </div>

    <!-- Секция субтитров -->
    <div class="subtitles-section" th:if="${movie.subtitles != null and !movie.subtitles.empty}">
        <h2>Доступные субтитры</h2>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Язык</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="subtitle : ${movie.subtitles}">
                    <td th:text="${subtitle.language}">Язык</td>
                    <td>
                        <a th:href="@{/subeditor/subtitles/__${subtitle.id}__/edit}" class="btn">Изменить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="actions">
        <a th:href="@{/subeditor/movies}" class="btn">Назад к списку фильмов</a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Фильм: ' + ${movie.name}">Фильм</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/subEditor.css}">
</head>
<body>
<header>
    <div class="header-content">
        <div class="logo">
            <i class="fas fa-film"></i>
            <span>SubEditor</span>
        </div>
        <a href="/subeditor/upload" class="back-btn">
            <i class="fas fa-upload"></i>
            Загрузить субтитры
        </a>
        <a href="/subeditor/movies" class="back-btn">
            <i class="fas fa-list"></i>
            Все фильмы
        </a>
    </div>
</header>

<div class="container">
    <div class="movie-card">
        <div class="movie-header">
            <h1 class="movie-title" th:text="${movie.name}">Название фильма</h1>
        </div>

        <div class="subtitles-section">
            <h2 class="section-title">
                <i class="fas fa-closed-captioning"></i>
                Доступные языки субтитров
            </h2>

            <ul class="language-list">
                <!-- Простой цикл по SubtitleEntry -->
                <li class="language-item" th:each="subtitleEntry : ${movie.subtitles}">
                    <div class="language-name">
                        <!-- Простой флаг (можно заменить на иконку или убрать) -->
                        <i class="fas fa-globe"></i>
                        <span th:text="${subtitleEntry.language}">Язык</span>
                    </div>
                    <!-- Ссылка для скачивания -->
                    <a th:href="@{'/subeditor/movies/' + ${movie.id} + '/subtitles/' + ${subtitleEntry.id} + '/download'}"
                       class="btn" target="_blank">
                        <i class="fas fa-download"></i>
                        Скачать
                    </a>
                    <!-- Ссылка для редактирования -->
                    <a th:href="@{'/subeditor/movies/' + ${movie.id} + '/subtitles/' + ${subtitleEntry.id} + '/edit'}"
                       class="btn btn-edit">
                        <i class="fas fa-edit"></i>
                        Редактировать
                    </a>
                </li>
            </ul>

            <!-- Сообщение если нет субтитров -->
            <div th:if="${#lists.isEmpty(movie.subtitles)}" class="no-subtitles">
                <i class="fas fa-exclamation-circle"></i>
                Нет доступных субтитров для этого фильма
            </div>
        </div>
    </div>
</div>
</body>
</html>

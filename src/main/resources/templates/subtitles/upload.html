<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка субтитров</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/subEditor.css}">
</head>
<body>
<th:block th:insert="~{fragments/navbar :: navbar}"></th:block>
<header>
    <div class="header-content">
        <div class="logo">
            <i class="fas fa-film"></i>
            <span>SubEditor</span>
        </div>
        <a href="/subeditor/movies" class="back-btn">
            <i class="fas fa-list"></i>
            Все фильмы
        </a>
    </div>
</header>

<div class="container">
    <div class="upload-form">
        <h1 class="section-title" style="justify-content: center;">
            <i class="fas fa-upload"></i>
            Загрузить файл субтитров
        </h1>

        <form th:action="@{/subeditor/upload}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="file" class="form-control" />
            </div>
            <button type="submit" class="btn" style="width: 100%;">
                <i class="fas fa-cloud-upload-alt"></i>
                Загрузить
            </button>
        </form>

        <div th:if="${error}" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>
    </div>
</div>
</body>
</html>
